name: Build HACS bundle

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/assemble.mjs"
      - "package.json"
      - ".github/workflows/build-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bundle
        run: npm run bundle

      - name: Check generated JavaScript
        run: node --check dist/ha-component-library.js

      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- dist/ha-component-library.js; then
            echo "Bundle is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ha-component-library.js
          git commit -m "Build HACS bundle"
          git push
