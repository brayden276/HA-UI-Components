name: Build HACS bundle

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/build-bundle.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/build-bundle.yml"
  workflow_dispatch:

concurrency:
  group: hacs-bundle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bundle
        run: npm run bundle

      - name: Run repository validation
        run: npm run check

      - name: Run strict style-preservation check
        run: npm run check:style

      - name: Run release dry-run
        run: npm run release:dry-run

      - name: Commit generated bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- dist/ha-component-library.js; then
            echo "Bundle is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ha-component-library.js
          git commit -m "Build HACS bundle"
          git push
